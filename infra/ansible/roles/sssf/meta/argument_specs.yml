---
argument_specs:
  main:
    short_description: Install the pinned Super Simple Software Factory on a dedicated guest.
    options:
      sssf_vmid:
        type: int
        required: true
      sssf_runtime_user:
        type: str
        required: false
      sssf_workspace_root:
        type: str
        required: false
      sssf_data_dir:
        type: str
        required: false
      sssf_data_device:
        type: str
        required: false
      sssf_pi_path:
        type: str
        required: false
      sssf_uv_path:
        type: str
        required: false
      sssf_config_path:
        type: str
        required: false
      sssf_upstream_repository:
        type: str
        required: false
      sssf_upstream_commit:
        type: str
        required: true
      sssf_artifact_path:
        type: str
        required: false
        description: "Controller-side reviewed artifact cache root for SSSF runtime archives."
      sssf_uv_version:
        type: str
        required: false
      sssf_uv_sha256:
        type: str
        required: false
      sssf_pi_version:
        type: str
        required: false
      sssf_pi_sha256:
        type: str
        required: false
      sssf_bun_version:
        type: str
        required: false
      sssf_bun_sha256:
        type: str
        required: false
      sssf_allowed_repositories:
        type: list
        elements: str
        required: false
      sssf_openrouter_api_key:
        type: str
        required: false
        no_log: true
      sssf_openai_api_key:
        type: str
        required: false
        no_log: true
      sssf_fireworks_api_key:
        type: str
        required: false
        no_log: true
      sssf_visualizer_enabled:
        type: bool
        required: false
      sssf_visualizer_host:
        type: str
        required: false
      sssf_visualizer_port:
        type: int
        required: false
      sssf_max_concurrent_runs:
        type: int
        required: false
      sssf_provider:
        type: str
        required: false
      sssf_visualizer_command:
        type: str
        required: false
      sssf_nodesource_key_sha256:
        type: str
        required: false
        description: "Lowercase SHA-256 for the reviewed NodeSource signing key."
      sssf_nodesource_key_fingerprint:
        type: str
        required: false
        description: "Expected uppercase 40-hex primary fingerprint for the NodeSource signing key."
