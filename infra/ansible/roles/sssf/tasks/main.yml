---
- name: Validate SSSF required variables
  tags: [validation]
  ansible.builtin.assert:
    that:
      - sssf_vmid is defined
      - sssf_runtime_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - sssf_runtime_user != 'root'
      - sssf_upstream_repository is match('^https://[^/@]+(?:/[^/@]+)+$')
      - sssf_upstream_commit is match('^[0-9a-f]{40}$')
      - sssf_workspace_root is match('^/[^ ]+$')
      - sssf_data_dir is match('^/[^ ]+$')
      - sssf_config_path is match('^/[^ ]+$')
      - sssf_visualizer_host in ['127.0.0.1', '::1', 'localhost']
      - sssf_visualizer_port | int >= 1
      - sssf_visualizer_port | int <= 65535
      - sssf_max_concurrent_runs | int >= 1
      - sssf_max_concurrent_runs | int <= 4
      - sssf_allowed_repositories is iterable
      - ansible_architecture == 'x86_64'
      - sssf_artifact_path is match('^/[^ ]+$')
      - sssf_uv_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - sssf_pi_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - sssf_bun_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - sssf_uv_sha256 is match('^[0-9a-f]{64}$')
      - sssf_pi_sha256 is match('^[0-9a-f]{64}$')
      - sssf_bun_sha256 is match('^[0-9a-f]{64}$')
      - sssf_nodesource_key_sha256 is match('^[0-9a-f]{64}$')
      - sssf_nodesource_key_fingerprint is match('^[0-9A-F]{40}$')
      - >-
        (sssf_provider == 'openrouter' and sssf_openrouter_api_key | length > 0) or
        (sssf_provider == 'openai' and sssf_openai_api_key | length > 0) or
        (sssf_provider == 'fireworks' and sssf_fireworks_api_key | length > 0)
    fail_msg: >-
      SSSF requires a pinned upstream commit, non-root runtime user, normalized paths,
      loopback-only visualizer binding, x86_64 reviewed runtime pins, bounded concurrency,
      and at least one provider key.

- name: Install SSSF operating-system dependencies
  tags: [packages]
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - jq
      - python3
      - python3-venv
      - sqlite3
      - build-essential
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure SSSF runtime user exists
  tags: [config]
  ansible.builtin.user:
    name: "{{ sssf_runtime_user }}"
    shell: /bin/bash
    create_home: true
    groups: users
    append: true

- name: Ensure SSSF data mount point exists
  tags: [config]
  ansible.builtin.file:
    path: "{{ sssf_data_dir }}"
    state: directory
    owner: "{{ sssf_runtime_user }}"
    group: "{{ sssf_runtime_user }}"
    mode: '0750'

- name: Detect SSSF data disk filesystem
  tags: [config]
  ansible.builtin.command:
    argv: [blkid, -s, TYPE, -o, value, "{{ sssf_data_device }}"]
  register: sssf_data_filesystem
  changed_when: false
  failed_when: false

- name: Create SSSF data disk filesystem when absent
  tags: [config]
  ansible.builtin.command:
    argv: [mkfs.ext4, -F, "{{ sssf_data_device }}"]
  when: sssf_data_filesystem.stdout | trim == ''
  changed_when: true

- name: Persist SSSF data disk mount
  tags: [config]
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ sssf_data_device | regex_escape }}\\s"
    line: "{{ sssf_data_device }} {{ sssf_data_dir }} ext4 noatime 0 2"
    owner: root
    group: root
    mode: '0644'

- name: Mount SSSF data disk
  tags: [config]
  ansible.builtin.command:
    argv: [mount, "{{ sssf_data_dir }}"]
  register: sssf_mount_result
  changed_when: sssf_mount_result.rc == 0
  failed_when: false

- name: Ensure SSSF directories exist
  tags: [config]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(sssf_runtime_user) }}"
    group: "{{ item.group | default(sssf_runtime_user) }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ sssf_workspace_root }}", mode: '0750' }
    - { path: "{{ sssf_data_dir }}", mode: '0750' }
    - { path: "{{ sssf_data_dir }}/upstream", mode: '0750' }
    - { path: "{{ sssf_data_dir }}/factory", mode: '0750' }
    - { path: /etc/sssf, owner: root, group: root, mode: '0755' }

- name: Ensure Node.js 22 is available for the Pi coding agent
  tags: [config]
  ansible.builtin.shell: |
    set -euo pipefail
    required_version='22.19.0'
    if command -v node >/dev/null 2>&1; then
      installed_version="$(node --version | sed 's/^v//')"
      if dpkg --compare-versions "${installed_version}" ge "${required_version}"; then
        printf '%s\n' node-current
        exit 0
      fi
    fi
    install -d -m 0755 /etc/apt/keyrings
    key="$(mktemp)"
    trap 'rm -f "${key}"' EXIT
    curl -fsSL -o "${key}" https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    printf '%s  %s\n' {{ sssf_nodesource_key_sha256 | quote }} "${key}" | sha256sum -c -
    [[ "$(gpg --show-keys --with-colons "${key}" | awk -F: '$1 == "fpr" { print $10; exit }')" = {{ sssf_nodesource_key_fingerprint | quote }} ]]
    gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg "${key}"
    printf '%s\n' \
      'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main' \
      > /etc/apt/sources.list.d/nodesource.list
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
  args:
    executable: /bin/bash
  register: sssf_node_install
  changed_when: sssf_node_install.rc == 0 and 'node-current' not in sssf_node_install.stdout

- name: Validate Node.js version for the Pi coding agent
  tags: [validation]
  ansible.builtin.command: node --version
  register: sssf_node_version
  changed_when: false
  failed_when: >-
    sssf_node_version.rc != 0 or
    (sssf_node_version.stdout | trim | regex_replace('^v', '')) is version('22.19.0', '<')

- name: Check reviewed SSSF runtime artifacts on the controller
  tags: [validation]
  ansible.builtin.stat:
    path: "{{ sssf_artifact_path }}/{{ item.tool }}/{{ item.version }}/{{ item.filename }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: sssf_cached_artifacts
  loop:
    - { tool: uv, version: "{{ sssf_uv_version }}", filename: uv-x86_64-unknown-linux-gnu.tar.gz, checksum: "{{ sssf_uv_sha256 }}" }
    - { tool: pi, version: "{{ sssf_pi_version }}", filename: pi-linux-x64.tar.gz, checksum: "{{ sssf_pi_sha256 }}" }
    - { tool: bun, version: "{{ sssf_bun_version }}", filename: bun-linux-x64.zip, checksum: "{{ sssf_bun_sha256 }}" }
  when: item.tool != 'bun' or sssf_visualizer_enabled | bool

- name: Require reviewed SSSF runtime artifacts
  tags: [validation]
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.checksum == item.item.checksum
    fail_msg: "Missing or checksum-mismatched reviewed SSSF {{ item.item.tool }} artifact in {{ sssf_artifact_path }}."
  loop: "{{ sssf_cached_artifacts.results }}"
  when: not item.skipped | default(false)

- name: Stage reviewed SSSF runtime artifacts
  tags: [packages]
  ansible.builtin.copy:
    src: "{{ sssf_artifact_path }}/{{ item.tool }}/{{ item.version }}/{{ item.filename }}"
    dest: "/var/tmp/sssf-{{ item.tool }}-{{ item.version }}.{{ item.filename.split('.')[-1] }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - { tool: uv, version: "{{ sssf_uv_version }}", filename: uv-x86_64-unknown-linux-gnu.tar.gz }
    - { tool: pi, version: "{{ sssf_pi_version }}", filename: pi-linux-x64.tar.gz }
    - { tool: bun, version: "{{ sssf_bun_version }}", filename: bun-linux-x64.zip }
  when: item.tool != 'bun' or sssf_visualizer_enabled | bool

- name: Install checksum-verified uv runtime
  tags: [packages]
  ansible.builtin.file:
    path: "/opt/sssf/runtimes/uv/{{ sssf_uv_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Extract checksum-verified uv runtime
  tags: [packages]
  ansible.builtin.unarchive:
    src: "/var/tmp/sssf-uv-{{ sssf_uv_version }}.gz"
    dest: "/opt/sssf/runtimes/uv/{{ sssf_uv_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "/opt/sssf/runtimes/uv/{{ sssf_uv_version }}/uv"

- name: Expose checksum-verified uv runtime
  tags: [config]
  ansible.builtin.file:
    src: "/opt/sssf/runtimes/uv/{{ sssf_uv_version }}/uv"
    dest: "{{ sssf_uv_path }}"
    state: link
    force: true

- name: Create Pi runtime release directory
  tags: [config]
  ansible.builtin.file:
    path: "/opt/sssf/runtimes/pi/{{ sssf_pi_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Extract checksum-verified Pi runtime
  tags: [packages]
  ansible.builtin.unarchive:
    src: "/var/tmp/sssf-pi-{{ sssf_pi_version }}.gz"
    dest: "/opt/sssf/runtimes/pi/{{ sssf_pi_version }}"
    remote_src: true
    creates: "/opt/sssf/runtimes/pi/{{ sssf_pi_version }}/pi/pi"

- name: Expose checksum-verified Pi runtime
  tags: [config]
  ansible.builtin.file:
    src: "/opt/sssf/runtimes/pi/{{ sssf_pi_version }}/pi/pi"
    dest: "{{ sssf_pi_path }}"
    state: link
    force: true


- name: Initialize SSSF upstream checkout
  tags: [packages]
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -d {{ (sssf_data_dir ~ '/upstream/.git') | quote }} ]; then
      rm -rf {{ sssf_data_dir | quote }}/upstream
      git clone --no-checkout {{ sssf_upstream_repository | quote }} {{ (sssf_data_dir ~ '/upstream') | quote }}
    fi
    upstream={{ (sssf_data_dir ~ '/upstream') | quote }}
    git -c safe.directory="${upstream}" -C "${upstream}" fetch --depth=1 origin {{ sssf_upstream_commit | quote }}
    git -c safe.directory="${upstream}" -C "${upstream}" checkout --force {{ sssf_upstream_commit | quote }}
    chown -R {{ sssf_runtime_user | quote }}:{{ sssf_runtime_user | quote }} {{ (sssf_data_dir ~ '/upstream') | quote }}
  args:
    executable: /bin/bash
  changed_when: true

- name: Install SSSF config
  tags: [packages]
  ansible.builtin.template:
    src: sssf.config.yaml.j2
    dest: "{{ sssf_config_path }}"
    owner: root
    group: "{{ sssf_runtime_user }}"
    mode: '0640'
  notify: Restart sssf visualizer

- name: Install SSSF environment file
  tags: [packages]
  ansible.builtin.template:
    src: sssf.env.j2
    dest: /etc/sssf/env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart sssf visualizer

- name: Install SSSF workspace initialization helper
  tags: [packages]
  ansible.builtin.template:
    src: sssf-init
    dest: /usr/local/bin/sssf-init
    owner: root
    group: root
    mode: '0755'

- name: Install SSSF health check
  tags: [health]
  ansible.builtin.template:
    src: sssf-health
    dest: /usr/local/bin/sssf-health
    owner: root
    group: root
    mode: '0755'

- name: Install SSSF visualizer unit
  tags: [packages]
  ansible.builtin.template:
    src: sssf-visualizer.service.j2
    dest: /etc/systemd/system/sssf-visualizer.service
    owner: root
    group: root
    mode: '0644'
  when: sssf_visualizer_enabled | bool
  notify: Restart sssf visualizer

- name: Install Bun for the optional SSSF visualizer
  tags: [packages]
  ansible.builtin.file:
    path: "/opt/sssf/runtimes/bun/{{ sssf_bun_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: sssf_visualizer_enabled | bool

- name: Extract checksum-verified Bun runtime
  tags: [packages]
  ansible.builtin.unarchive:
    src: "/var/tmp/sssf-bun-{{ sssf_bun_version }}.zip"
    dest: "/opt/sssf/runtimes/bun/{{ sssf_bun_version }}"
    remote_src: true
    creates: "/opt/sssf/runtimes/bun/{{ sssf_bun_version }}/bun-linux-x64/bun"
  when: sssf_visualizer_enabled | bool

- name: Expose checksum-verified Bun runtime
  tags: [config]
  ansible.builtin.file:
    src: "/opt/sssf/runtimes/bun/{{ sssf_bun_version }}/bun-linux-x64/bun"
    dest: /usr/local/bin/bun
    state: link
    force: true
  when: sssf_visualizer_enabled | bool

- name: Install SSSF visualizer dependencies from its lockfile
  tags: [packages]
  ansible.builtin.command:
    argv:
      - bun
      - install
      - --frozen-lockfile
      - --cwd
      - "{{ sssf_data_dir }}/upstream/.claude/skills/sssf/apps/visualizer"
  become: true
  become_user: "{{ sssf_runtime_user }}"
  when: sssf_visualizer_enabled | bool
  changed_when: true

- name: Remove SSSF visualizer unit when disabled
  tags: [config]
  ansible.builtin.file:
    path: /etc/systemd/system/sssf-visualizer.service
    state: absent
  when: not (sssf_visualizer_enabled | bool)
  notify: Restart sssf visualizer

- name: Enable SSSF visualizer
  tags: [service]
  ansible.builtin.systemd:
    name: sssf-visualizer
    enabled: true
    state: started
    daemon_reload: true
  when: sssf_visualizer_enabled | bool

- name: Verify SSSF source revision
  tags: [validation]
  ansible.builtin.command:
    argv: [git, -c, "safe.directory={{ sssf_data_dir }}/upstream", -C, "{{ sssf_data_dir }}/upstream", rev-parse, HEAD]
  register: sssf_revision
  changed_when: false
  failed_when: sssf_revision.stdout | trim != sssf_upstream_commit
