---
- name: Validate Forgejo Caddy variables
  tags: [validation]
  ansible.builtin.assert:
    that:
      - caddy_email is defined
      - caddy_cloudflare_api_token is defined
    fail_msg: caddy_email and caddy_cloudflare_api_token are required when forgejo_enable_caddy is true.
- name: Install Caddy build dependencies in Forgejo LXC
  tags: [packages]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "set -euo pipefail; packages=\"ca-certificates curl\"; missing=0; for package in ${packages}; do\n  dpkg-query -W \"${package}\" >/dev/null 2>&1 || missing=1;\ndone; if [[ \"${missing}\" -eq 1 ]]; then\n  DEBIAN_FRONTEND=noninteractive apt-get update;\n  DEBIAN_FRONTEND=noninteractive apt-get install -y ${packages};\nfi"  # yamllint disable-line rule:line-length
  changed_when: false
- name: Check whether Caddy has Cloudflare DNS module
  tags: [validation]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - caddy list-modules 2>/dev/null | grep -Fx dns.providers.cloudflare
  register: forgejo_caddy_cloudflare_module
  changed_when: false
  failed_when: false

- name: Require reviewed Forgejo-local Caddy artifact before guest mutation
  tags: [always]
  ansible.builtin.include_tasks: ../../../tasks/reviewed-artifact-cache.yml
  vars:
    reviewed_artifact_cache_root: "{{ forgejo_artifact_cache_root | default('/var/lib/infra-fabric/artifacts') }}"
    reviewed_artifact_stage_root: /var/tmp/infra-fabric-artifacts
    reviewed_artifacts:
      - name: caddy-cloudflare
        version: "{{ forgejo_caddy_cloudflare_version }}"
        architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'unsupported' }}"
        filename: "caddy-cloudflare-{{ forgejo_caddy_cloudflare_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        sha256: >-
          {{ forgejo_caddy_cloudflare_sha256_amd64
             if ansible_architecture == 'x86_64'
             else forgejo_caddy_cloudflare_sha256_arm64 }}

- name: Install Caddy package and service prerequisites
  tags: [packages]
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Ensure Caddy service account exists
  tags: [config]
  ansible.builtin.user:
    name: caddy
    system: true
    state: present

- name: Install reviewed Forgejo-local Caddy with Cloudflare DNS module
  tags: [packages]
  ansible.builtin.copy:
    src: "/var/tmp/infra-fabric-artifacts/caddy-cloudflare/{{ forgejo_caddy_cloudflare_version }}/{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}/caddy-cloudflare-{{ forgejo_caddy_cloudflare_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"  # yamllint disable-line rule:line-length
    dest: /usr/bin/caddy
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: Restart caddy
- name: Install Forgejo Caddy env
  tags: [packages]
  ansible.builtin.template:
    src: caddy.env.j2
    dest: /etc/caddy/env
    mode: '0600'
    owner: root
    group: caddy
  no_log: true
  notify: Restart caddy
- name: Install Forgejo Caddyfile
  tags: [packages]
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    owner: root
    group: root
  notify: Restart caddy
- name: Ensure Forgejo Caddy systemd override directory exists
  tags: [config]
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root
- name: Install Forgejo Caddy systemd override
  tags: [packages]
  ansible.builtin.template:
    src: caddy-override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    mode: '0644'
    owner: root
    group: root
  notify: Restart caddy
- name: Validate Forgejo Caddy config
  tags: [validation]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - set -a && . /etc/caddy/env && set +a && caddy validate --config /etc/caddy/Caddyfile
  changed_when: false
- name: Enable Forgejo Caddy service
  tags: [service]
  ansible.builtin.command:
    argv:
      - systemctl
      - enable
      - --now
      - caddy
  changed_when: false
