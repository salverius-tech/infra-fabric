---
- name: Validate Tailscale client variables
  tags: [validation]
  ansible.builtin.assert:
    that:
      - tailscale_client_vmid is defined
      - not (tailscale_client_restore_backup | default(false) | bool) or tailscale_client_backup_archive is defined
    fail_msg: tailscale_client_vmid is required, and tailscale_client_backup_archive is required when restore is enabled.
  when: tailscale_client_enabled | default(false) | bool
- name: Install Tailscale repository prerequisites
  tags: [packages]
  ansible.builtin.apt:
    name:
      - ca-certificates
    state: present
    update_cache: true
  when: tailscale_client_enabled | default(false) | bool
- name: Install checksum-verified Tailscale repository key
  tags: [packages]
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: sha256:3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
    owner: root
    group: root
    mode: '0644'
  when: tailscale_client_enabled | default(false) | bool
- name: Configure signed Tailscale apt repository
  tags: [config]
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
    filename: tailscale
    state: present
    update_cache: true
  when: tailscale_client_enabled | default(false) | bool
- name: Install Tailscale package
  tags: [packages]
  ansible.builtin.apt:
    name: tailscale
    state: present
  when: tailscale_client_enabled | default(false) | bool
- name: Configure IPv4 forwarding in Tailscale client LXC
  tags: [config]
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale-client.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: '0644'
  when:
    - tailscale_client_enabled | default(false) | bool
    - tailscale_client_enable_ip_forwarding | default(true) | bool
- name: Read active IPv4 forwarding state in Tailscale client LXC
  tags: [config]
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - net.ipv4.ip_forward
  register: tailscale_client_ipv4_forwarding
  changed_when: false
  check_mode: false
  when:
    - tailscale_client_enabled | default(false) | bool
    - tailscale_client_enable_ip_forwarding | default(true) | bool
- name: Converge active IPv4 forwarding state in Tailscale client LXC
  tags: [config]
  ansible.builtin.command:
    argv:
      - sysctl
      - -w
      - net.ipv4.ip_forward=1
  changed_when: tailscale_client_ipv4_forwarding.stdout | default('') | trim != '1'
  when:
    - tailscale_client_enabled | default(false) | bool
    - tailscale_client_enable_ip_forwarding | default(true) | bool
    - tailscale_client_ipv4_forwarding.stdout | default('') | trim != '1'
- name: Install Tailscale backup archive
  tags: [backup]
  ansible.builtin.copy:
    src: '{{ tailscale_client_backup_archive }}'
    dest: /tmp/tailscale-client-backup.tgz
    mode: '0600'
    owner: root
    group: root
  no_log: true
  when:
    - tailscale_client_enabled | default(false) | bool
    - tailscale_client_restore_backup | default(false) | bool
- name: Restore Tailscale state and selected OS config from backup
  tags: [restore]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - set -euo pipefail; systemctl stop tailscaled || true; tar --warning=no-unknown-keyword -xzf /tmp/tailscale-client-backup.tgz -C / --wildcards --no-anchored etc/default/tailscaled etc/systemd/system/tailscaled.service.d var/lib/tailscale/tailscaled.state etc/sysctl.d; chown root:root /var/lib/tailscale/tailscaled.state 2>/dev/null || true; chmod 0600 /var/lib/tailscale/tailscaled.state 2>/dev/null || true; systemctl daemon-reload; rm -f /tmp/tailscale-client-backup.tgz  # yamllint disable-line rule:line-length
  no_log: true
  changed_when: true
  notify: Restart tailscaled
  when:
    - tailscale_client_enabled | default(false) | bool
    - tailscale_client_restore_backup | default(false) | bool
- name: Ensure tailscaled is enabled and running
  tags: [service]
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  when: tailscale_client_enabled | default(false) | bool
- name: Authenticate Tailscale client with auth key when requested
  tags: [config]
  ansible.builtin.command:
    argv: "{{\n  [\n    'tailscale', 'up', '--authkey', tailscale_client_auth_key,\n  ] + (tailscale_client_up_args | default([]))\n}}"
  no_log: true
  changed_when: true
  when:
    - tailscale_client_enabled | default(false) | bool
    - not tailscale_client_restore_backup | default(false) | bool
    - tailscale_client_auth_key is defined
    - tailscale_client_auth_key | length > 0
- name: Flush Tailscale restart before service checks
  tags: [service]
  ansible.builtin.meta: flush_handlers
  when: tailscale_client_enabled | default(false) | bool
- name: Verify tailscaled service is active
  tags: [health]
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - tailscaled
  register: tailscale_client_active
  changed_when: false
  retries: 6
  delay: 5
  until: tailscale_client_active.rc == 0
  when: tailscale_client_enabled | default(false) | bool
- name: Check Tailscale client status
  tags: [health]
  ansible.builtin.command:
    argv:
      - tailscale
      - status
  register: tailscale_client_status
  changed_when: false
  when: tailscale_client_enabled | default(false) | bool
