---
- name: Validate Caddy proxy variables
  tags: [validation]
  ansible.builtin.assert:
    that:
      - technitium_vmid is defined
      - caddy_server_name is defined or caddy_server_names is defined
      - caddy_upstream is defined
      - caddy_email is defined
      - caddy_cloudflare_api_token is defined
    fail_msg: technitium_vmid, caddy_server_name or caddy_server_names, caddy_upstream, caddy_email, and caddy_cloudflare_api_token are required.
- name: Check whether DNS LXC Caddy has Cloudflare DNS module
  tags: [validation]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - caddy list-modules 2>/dev/null | grep -Fx dns.providers.cloudflare
  register: caddy_proxy_cloudflare_module
  changed_when: false
  failed_when: false

- name: Require reviewed DNS LXC Caddy artifact before guest mutation
  tags: [always]
  ansible.builtin.include_tasks: ../../../tasks/reviewed-artifact-cache.yml
  vars:
    reviewed_artifact_cache_root: "{{ caddy_proxy_artifact_cache_root | default('/var/lib/infra-fabric/artifacts') }}"
    reviewed_artifact_stage_root: /var/tmp/infra-fabric-artifacts
    reviewed_artifacts:
      - name: caddy-cloudflare
        version: "{{ caddy_proxy_caddy_cloudflare_version }}"
        architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'unsupported' }}"
        filename: "caddy-cloudflare-{{ caddy_proxy_caddy_cloudflare_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        sha256: >-
          {{ caddy_proxy_caddy_cloudflare_sha256_amd64
             if ansible_architecture == 'x86_64'
             else caddy_proxy_caddy_cloudflare_sha256_arm64 }}


- name: Install Caddy package and service prerequisites
  tags: [packages]
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Ensure Caddy service account exists
  tags: [config]
  ansible.builtin.user:
    name: caddy
    system: true
    state: present

- name: Install reviewed DNS LXC Caddy with Cloudflare DNS module
  tags: [packages]
  ansible.builtin.copy:
    src: "/var/tmp/infra-fabric-artifacts/caddy-cloudflare/{{ caddy_proxy_caddy_cloudflare_version }}/{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}/caddy-cloudflare-{{ caddy_proxy_caddy_cloudflare_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"  # yamllint disable-line rule:line-length
    dest: /usr/bin/caddy
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: Restart caddy
- name: Install Caddy build dependencies in DNS LXC
  tags: [packages]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "set -euo pipefail; packages=\"ca-certificates curl\"; missing=0; for package in ${packages}; do\n  dpkg-query -W \"${package}\" >/dev/null 2>&1 || missing=1;\ndone; if [[ \"${missing}\" -eq 1 ]]; then\n  DEBIAN_FRONTEND=noninteractive apt-get update;\n  DEBIAN_FRONTEND=noninteractive apt-get install -y ${packages};\nfi"  # yamllint disable-line rule:line-length
  changed_when: false

- name: Install DNS LXC Caddy env
  tags: [packages]
  ansible.builtin.template:
    src: caddy.env.j2
    dest: /etc/caddy/env
    mode: '0600'
    owner: root
    group: caddy
  no_log: true
  notify: Restart caddy
- name: Install DNS LXC Caddyfile
  tags: [packages]
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    owner: root
    group: root
  notify: Restart caddy
- name: Ensure DNS LXC Caddy systemd override directory exists
  tags: [config]
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root
- name: Install DNS LXC Caddy systemd override
  tags: [packages]
  ansible.builtin.template:
    src: caddy-override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    mode: '0644'
    owner: root
    group: root
  notify: Restart caddy
- name: Validate DNS LXC Caddy config
  tags: [validation]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - set -a && . /etc/caddy/env && set +a && caddy validate --config /etc/caddy/Caddyfile
  changed_when: false
- name: Enable DNS LXC Caddy service
  tags: [service]
  ansible.builtin.command:
    argv:
      - systemctl
      - enable
      - --now
      - caddy
  changed_when: false
- name: Flush DNS LXC Caddy restart before endpoint checks
  tags: [health]
  ansible.builtin.meta: flush_handlers
- name: Verify DNS LXC Caddy service is active
  tags: [health]
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - caddy
  changed_when: false
  register: caddy_proxy_active
  retries: 6
  delay: 5
  until: caddy_proxy_active.rc == 0
- name: Verify DNS LXC Caddy upstream responds locally
  tags: [validation]
  ansible.builtin.uri:
    url: "http://{{ caddy_upstream }}/"
    status_code:
      - 200
      - 302
    return_content: false
  register: caddy_proxy_upstream_check
  retries: 12
  delay: 5
  until: caddy_proxy_upstream_check.status in [200, 302]
- name: Verify DNS LXC HTTPS proxy route locally
  tags: [health]
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --insecure
      - --max-time
      - "10"
      - --resolve
      - "{{ (caddy_server_names if caddy_server_names is defined else [caddy_server_name]) | first }}:443:127.0.0.1"
      - "https://{{ (caddy_server_names if caddy_server_names is defined else [caddy_server_name]) | first }}/"
  changed_when: false
  register: caddy_proxy_https_check
  retries: 12
  delay: 5
  until: caddy_proxy_https_check.rc == 0
