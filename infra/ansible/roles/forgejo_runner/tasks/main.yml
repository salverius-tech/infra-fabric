---
- name: Validate Forgejo Actions runner variables
  tags: [validation]
  ansible.builtin.assert:
    that:
      - forgejo_runner_vmid is defined
      - forgejo_vmid is defined
      - forgejo_runner_url is defined
      - forgejo_runner_scope is defined
      - forgejo_runner_registration_secret is defined
      - forgejo_runner_registration_secret | length >= 40
      - forgejo_runner_label is defined
    fail_msg: forgejo_runner_vmid, forgejo_vmid, forgejo_runner_url, forgejo_runner_scope, forgejo_runner_registration_secret, and forgejo_runner_label are required.  # yamllint disable-line rule:line-length
  no_log: true
- name: Require reviewed Forgejo runner artifacts before guest mutation
  tags: [always]
  ansible.builtin.include_tasks: ../../../tasks/reviewed-artifact-cache.yml
  vars:
    reviewed_artifact_cache_root: "{{ forgejo_runner_artifact_cache_root | default('/var/lib/infra-fabric/artifacts') }}"
    reviewed_artifact_stage_root: /var/tmp/infra-fabric-artifacts
    reviewed_artifacts:
      - name: docker-compose
        version: "{{ forgejo_runner_compose_version }}"
        architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'unsupported' }}"
        filename: "docker-compose-{{ forgejo_runner_compose_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        sha256: >-
          {{ forgejo_runner_compose_sha256_amd64
             if ansible_architecture == 'x86_64'
             else forgejo_runner_compose_sha256_arm64 }}
      - name: just
        version: "{{ forgejo_runner_just_version }}"
        architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'unsupported' }}"
        filename: "just-{{ forgejo_runner_just_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        sha256: >-
          {{ forgejo_runner_just_sha256_amd64
             if ansible_architecture == 'x86_64'
             else forgejo_runner_just_sha256_arm64 }}
      - name: forgejo-runner
        version: "{{ forgejo_runner_version }}"
        architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'unsupported' }}"
        filename: "forgejo-runner-{{ forgejo_runner_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        sha256: >-
          {{ forgejo_runner_sha256_amd64
             if ansible_architecture == 'x86_64'
             else forgejo_runner_sha256_arm64 }}

- name: Ensure Forgejo runner executable install parents exist
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /usr/local/lib/docker/cli-plugins
    - /usr/local/bin

- name: Install reviewed Forgejo runner tooling
  tags: [packages]
  ansible.builtin.copy:
    src: "/var/tmp/infra-fabric-artifacts/{{ item.name }}/{{ item.version }}/{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}/{{ item.filename }}"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: '0755'
  loop:
    - { name: docker-compose, version: "{{ forgejo_runner_compose_version }}", filename: "docker-compose-{{ forgejo_runner_compose_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}", dest: /usr/local/lib/docker/cli-plugins/docker-compose }  # yamllint disable-line rule:line-length
    - { name: just, version: "{{ forgejo_runner_just_version }}", filename: "just-{{ forgejo_runner_just_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}", dest: /usr/local/bin/just }  # yamllint disable-line rule:line-length
    - { name: forgejo-runner, version: "{{ forgejo_runner_version }}", filename: "forgejo-runner-{{ forgejo_runner_version }}-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}", dest: /usr/local/bin/forgejo-runner }  # yamllint disable-line rule:line-length

- name: Install Forgejo Actions runner dependencies in LXC
  tags: [packages]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "set -euo pipefail; packages=\"ca-certificates curl docker.io fuse-overlayfs git gnupg jq nodejs npm openssh-client python3 rsync tar\"; missing=0; for package in ${packages}; do\n  dpkg-query -W \"${package}\" >/dev/null 2>&1 || missing=1;\ndone; if [[ \"${missing}\" -eq 1 ]]; then\n  DEBIAN_FRONTEND=noninteractive apt-get update;\n  DEBIAN_FRONTEND=noninteractive apt-get install -y ${packages};\nfi; systemctl enable --now docker"  # yamllint disable-line rule:line-length
  changed_when: false
- name: Configure Forgejo runner resolver
  tags: [config]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "set -euo pipefail; tmp=\"$(mktemp)\"; printf '%s\\n' {% for server in forgejo_runner_dns_servers | default([]) %} 'nameserver {{ server }}' {% endfor %} > \"${tmp}\"; if cmp -s /etc/resolv.conf \"${tmp}\"; then\n  rm -f \"${tmp}\";\n  exit 0;\nfi; cat \"${tmp}\" > /etc/resolv.conf; rm -f \"${tmp}\"; exit 1"  # yamllint disable-line rule:line-length
  register: forgejo_runner_resolver
  changed_when: forgejo_runner_resolver.rc == 1
  failed_when: forgejo_runner_resolver.rc not in [0, 1]
  when: forgejo_runner_dns_servers is defined and forgejo_runner_dns_servers | length > 0
- name: Configure Forgejo runner host aliases
  tags: [config]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "set -euo pipefail; file=/etc/hosts; changed=0; {% for host in forgejo_runner_hosts | default([]) %} if grep -Eq '^[0-9.]+[[:space:]]+{{ host.name }}([[:space:]]|$)' \"${file}\"; then\n  if ! grep -Eq '^{{ host.address }}[[:space:]]+{{ host.name }}([[:space:]]|$)' \"${file}\"; then\n    sed -i -E 's#^[0-9.]+([[:space:]]+){{ host.name }}([[:space:]]|$)#{{ host.address }}\\1{{ host.name }}\\2#' \"${file}\";\n    changed=1;\n  fi;\nelse\n  printf '%s\\t%s\\n' '{{ host.address }}' '{{ host.name }}' >> \"${file}\";\n  changed=1;\nfi; {% endfor %} exit \"${changed}\""  # yamllint disable-line rule:line-length
  register: forgejo_runner_hosts_config
  changed_when: forgejo_runner_hosts_config.rc == 1
  failed_when: forgejo_runner_hosts_config.rc not in [0, 1]


- name: Ensure runner user and directories exist
  tags: [config]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "set -euo pipefail; if ! id runner >/dev/null 2>&1; then\n  useradd --system --home-dir /var/lib/forgejo-runner --shell /bin/bash --user-group --comment 'Forgejo Actions Runner' runner;\nfi; usermod -aG docker runner; install -d -m 0750 -o runner -g runner /var/lib/forgejo-runner /var/lib/forgejo-runner/work /var/lib/forgejo-runner/cache; install -d -m 0750 -o root -g runner /etc/forgejo-runner"  # yamllint disable-line rule:line-length
  changed_when: false
- name: Ensure Forgejo runner SSH key exists
  tags: [config]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "set -euo pipefail; install -d -m 0700 -o runner -g runner /var/lib/forgejo-runner/.ssh; if [[ ! -f /var/lib/forgejo-runner/.ssh/id_ed25519 ]]; then\n  key_comment=\"forgejo-runner@{{ forgejo_runner_hostname | default('forgejo-runner') }}\";\n  runuser -u runner -- ssh-keygen -t ed25519 -N '' -C \"${key_comment}\" -f /var/lib/forgejo-runner/.ssh/id_ed25519 >/dev/null;\nfi; chmod 0700 /var/lib/forgejo-runner/.ssh; chmod 0600 /var/lib/forgejo-runner/.ssh/id_ed25519; chmod 0644 /var/lib/forgejo-runner/.ssh/id_ed25519.pub"  # yamllint disable-line rule:line-length
  changed_when: false
- name: Read Forgejo runner SSH public key
  tags: [validation]
  ansible.builtin.command:
    argv:
      - cat
      - /var/lib/forgejo-runner/.ssh/id_ed25519.pub
  register: forgejo_runner_ssh_public_key
  changed_when: false
- name: Ensure root SSH directory exists on Proxmox host
  tags: [config]
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  delegate_to: pve
- name: Authorize Forgejo runner SSH key on Proxmox host
  tags: [config]
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: '{{ forgejo_runner_ssh_public_key.stdout }}'
    create: true
    owner: root
    group: root
    mode: '0600'
    state: present
  delegate_to: pve
- name: Read Proxmox host SSH public keys
  tags: [validation]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - |
        set -euo pipefail
        for key in /etc/ssh/ssh_host_*_key.pub; do
          awk -v host={{ hostvars['pve'].ansible_host | quote }} '{ print host " " $1 " " $2 }' "${key}"
        done
  register: forgejo_runner_proxmox_host_keys
  changed_when: false
  delegate_to: pve

- name: Trust Proxmox host key in Forgejo runner LXC
  tags: [config]
  ansible.builtin.copy:
    dest: /var/lib/forgejo-runner/.ssh/known_hosts
    content: "{{ forgejo_runner_proxmox_host_keys.stdout }}\n"
    owner: runner
    group: runner
    mode: '0644'


- name: Check existing Forgejo Actions runner registration in SQLite
  tags: [validation]
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - git
      - --
      - sqlite3
      - /var/lib/forgejo/data/forgejo.db
      - select ar.uuid from action_runner ar join repository r on r.id=ar.repo_id where ar.name='{{ forgejo_runner_name | default('homelab-deploy') }}' and lower(r.owner_name || '/' || r.lower_name)=lower('{{ forgejo_runner_scope }}') and ar.repo_id != 0 limit 1;  # yamllint disable-line rule:line-length
  register: forgejo_runner_existing_registration_sqlite
  changed_when: false
  failed_when: >-
    forgejo_runner_existing_registration_sqlite.rc != 0 and
    'no such table: action_runner' not in forgejo_runner_existing_registration_sqlite.stderr
  delegate_to: "{{ groups['forgejo'][0] }}"
  no_log: true
  when: forgejo_database.type | default('sqlite') == 'sqlite'
- name: Check existing Forgejo Actions runner registration in PostgreSQL
  tags: [validation]
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -At
      - -d
      - "{{ forgejo_database.name | default('forgejo') }}"
      - -c
      - select ar.uuid from action_runner ar join repository r on r.id=ar.repo_id where ar.name='{{ forgejo_runner_name | default('homelab-deploy') }}' and lower(r.owner_name || '/' || r.lower_name)=lower('{{ forgejo_runner_scope }}') and ar.repo_id != 0 limit 1;  # yamllint disable-line rule:line-length
  register: forgejo_runner_existing_registration_postgres
  changed_when: false
  failed_when: >-
    forgejo_runner_existing_registration_postgres.rc != 0 and
    "relation 'action_runner' does not exist" not in forgejo_runner_existing_registration_postgres.stderr
  delegate_to: "{{ groups['forgejo'][0] }}"
  no_log: true
  when: forgejo_database.type | default('sqlite') == 'postgres'
- name: Set existing Forgejo Actions runner registration result
  tags: [config]
  ansible.builtin.set_fact:
    forgejo_runner_existing_registration_stdout: >-
      {{ forgejo_runner_existing_registration_postgres.stdout | default(forgejo_runner_existing_registration_sqlite.stdout | default('')) }}
  no_log: true
- name: Register Forgejo Actions runner with Forgejo
  tags: [config]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - 'set -euo pipefail; runuser -u git -- env "$(printf ''%s=%s'' FORGEJO_RUNNER_SECRET "${FORGEJO_RUNNER_SECRET}")" /usr/local/bin/forgejo forgejo-cli actions register --config /etc/forgejo/app.ini --work-path /var/lib/forgejo --name "$1" --scope "$2" --secret "${FORGEJO_RUNNER_SECRET}" | tail -n1 # public-safety: allow-secret'  # yamllint disable-line rule:line-length
      - --
      - '{{ forgejo_runner_name | default(''homelab-deploy'') }}'
      - '{{ forgejo_runner_scope }}'
  environment:
    FORGEJO_RUNNER_SECRET: '{{ forgejo_runner_registration_secret }}'
  register: forgejo_runner_registration
  changed_when: false
  delegate_to: "{{ groups['forgejo'][0] }}"
  no_log: true
  when: forgejo_runner_existing_registration_stdout | trim == ""
- name: Set Forgejo runner UUID
  tags: [config]
  ansible.builtin.set_fact:
    forgejo_runner_uuid: "{{\n  forgejo_runner_existing_registration_stdout | trim\n  if forgejo_runner_existing_registration_stdout | trim != \"\"\n  else forgejo_runner_registration.stdout | trim\n}}"  # yamllint disable-line rule:line-length
  no_log: true
- name: Validate Forgejo runner UUID was resolved
  tags: [validation]
  ansible.builtin.assert:
    that:
      - forgejo_runner_uuid is defined
      - forgejo_runner_uuid | length > 0
    fail_msg: Forgejo runner UUID could not be resolved.
  no_log: true
- name: Normalize Forgejo repository-scoped runner ownership in SQLite
  tags: [config]
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - git
      - --
      - sqlite3
      - /var/lib/forgejo/data/forgejo.db
      - update action_runner set owner_id=0 where uuid='{{ forgejo_runner_uuid }}' and repo_id != 0 and owner_id != 0;
  changed_when: false
  delegate_to: "{{ groups['forgejo'][0] }}"
  when: forgejo_database.type | default('sqlite') == 'sqlite'
- name: Normalize Forgejo repository-scoped runner ownership in PostgreSQL
  tags: [config]
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -At
      - -d
      - "{{ forgejo_database.name | default('forgejo') }}"
      - -c
      - update action_runner set owner_id=0 where uuid='{{ forgejo_runner_uuid }}' and repo_id != 0 and owner_id != 0;
  changed_when: false
  delegate_to: "{{ groups['forgejo'][0] }}"
  when: forgejo_database.type | default('sqlite') == 'postgres'
- name: Install Forgejo runner env
  tags: [packages]
  ansible.builtin.template:
    src: runner.env.j2
    dest: /etc/forgejo-runner/env
    mode: '0640'
    owner: root
    group: runner
  no_log: true
- name: Install Forgejo runner config
  tags: [packages]
  ansible.builtin.template:
    src: runner-config.yml.j2
    dest: /etc/forgejo-runner/config.yml
    mode: '0640'
    owner: root
    group: runner
  no_log: true
- name: Install Forgejo runner systemd service
  tags: [packages]
  ansible.builtin.template:
    src: forgejo-runner.service.j2
    dest: /etc/systemd/system/forgejo-runner.service
    mode: '0644'
    owner: root
    group: root
- name: Enable Forgejo runner service
  tags: [service]
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - systemctl daemon-reload && systemctl enable --now forgejo-runner
  changed_when: false
- name: Flush Forgejo runner restart before service checks
  tags: [service]
  ansible.builtin.meta: flush_handlers
- name: Verify Forgejo runner service is active
  tags: [health]
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - forgejo-runner
  changed_when: false
  register: forgejo_runner_active
  retries: 6
  delay: 5
  until: forgejo_runner_active.rc == 0
- name: Verify Forgejo Actions runner registration remains present in SQLite
  tags: [validation]
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - git
      - --
      - sqlite3
      - /var/lib/forgejo/data/forgejo.db
      - select ar.uuid from action_runner ar join repository r on r.id=ar.repo_id where ar.name='{{ forgejo_runner_name | default('homelab-deploy') }}' and lower(r.owner_name || '/' || r.lower_name)=lower('{{ forgejo_runner_scope }}') and ar.repo_id != 0 limit 1;  # yamllint disable-line rule:line-length
  register: forgejo_runner_verify_registration_sqlite
  changed_when: false
  failed_when: forgejo_runner_verify_registration_sqlite.stdout | trim != forgejo_runner_uuid
  delegate_to: "{{ groups['forgejo'][0] }}"
  no_log: true
  when: forgejo_database.type | default('sqlite') == 'sqlite'
- name: Verify Forgejo Actions runner registration remains present in PostgreSQL
  tags: [validation]
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -At
      - -d
      - "{{ forgejo_database.name | default('forgejo') }}"
      - -c
      - select ar.uuid from action_runner ar join repository r on r.id=ar.repo_id where ar.name='{{ forgejo_runner_name | default('homelab-deploy') }}' and lower(r.owner_name || '/' || r.lower_name)=lower('{{ forgejo_runner_scope }}') and ar.repo_id != 0 limit 1;  # yamllint disable-line rule:line-length
  register: forgejo_runner_verify_registration_postgres
  changed_when: false
  failed_when: forgejo_runner_verify_registration_postgres.stdout | trim != forgejo_runner_uuid
  delegate_to: "{{ groups['forgejo'][0] }}"
  no_log: true
  when: forgejo_database.type | default('sqlite') == 'postgres'
