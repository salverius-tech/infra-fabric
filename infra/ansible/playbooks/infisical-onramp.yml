---
- name: Converge canonical host identities for Infisical onramp
  ansible.builtin.import_playbook: host-identity.yml
  vars:
    host_identity_hosts: onramp_host

- name: Configure Infisical onramp directly
  hosts: onramp_host
  gather_facts: true
  become: true
  roles:
    - infisical_onramp
