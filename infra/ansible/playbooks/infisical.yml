---
- name: Refresh Proxmox SSH trust before Infisical lifecycle checks
  ansible.builtin.import_playbook: proxmox-access-ready.yml
- name: Prepare Infisical LXC lifecycle boundary
  hosts: pve
  gather_facts: false
  roles:
    - role: lxc_ready
      vars:
        lxc_ready_vmid: '{{ infisical_vmid }}'
        lxc_ready_name: infisical
      when:
        - infisical_runtime.type | default('lxc') == 'lxc'
        - not (infra_host_identity_skip_root | default(false) | bool)
- name: Run direct access handoff for Infisical
  ansible.builtin.import_playbook: direct-access-ready.yml
  vars:
    direct_access_ready_hosts: infisical
- name: Converge canonical host identities for Infisical
  ansible.builtin.import_playbook: host-identity.yml
  vars:
    host_identity_hosts: infisical
- name: Configure Infisical directly
  hosts: infisical
  gather_facts: false
  become: true
  vars:
    caddy_cloudflare_api_token: "{{ lookup('env', 'CF_DNS_API_TOKEN') }}"
    infisical_auth_secret: "{{ lookup('env', 'INFISICAL_AUTH_SECRET') }}"
    infisical_encryption_key: "{{ lookup('env', 'INFISICAL_ENCRYPTION_KEY') }}"
    infisical_postgres_password: "{{ lookup('env', 'INFISICAL_POSTGRES_PASSWORD') }}"
  roles:
    - infisical
