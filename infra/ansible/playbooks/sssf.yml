---
- name: Run direct access handoff for SSSF
  ansible.builtin.import_playbook: direct-access-ready.yml
  vars:
    direct_access_ready_hosts: sssf
- name: Converge canonical host identities for SSSF
  ansible.builtin.import_playbook: host-identity.yml
  vars:
    host_identity_hosts: sssf
- name: Configure Super Simple Software Factory directly
  hosts: sssf
  gather_facts: true
  become: true
  vars:
    sssf_openrouter_api_key: "{{ lookup('ansible.builtin.env', 'OPENROUTER_API_KEY') }}"
    sssf_openai_api_key: "{{ lookup('ansible.builtin.env', 'OPENAI_API_KEY') }}"
    sssf_fireworks_api_key: "{{ lookup('ansible.builtin.env', 'FIREWORKS_API_KEY') }}"
  roles:
    - sssf
