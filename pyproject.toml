[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
patch = ["subprocess"]
parallel = true
source = ["scripts", "infra/ansible/scripts"]

[tool.coverage.report]
show_missing = true
