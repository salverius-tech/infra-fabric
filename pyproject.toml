[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "PERF", "SIM", "S107"]
ignore = [
  "E402",
  "E501",
  "PERF203",
  "PERF401",
  "SIM105",
  "SIM115",
  "SIM117",
  "UP022",
  "UP031",
]

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true
files = [
  "scripts/atomic_output.py",
  "scripts/private_files.py",
  "scripts/execution-snapshot.py",
  "scripts/tfplan-metadata.py",
  "scripts/secret_provider.py",
  "scripts/site_lock.py",
  "scripts/canonical-provider-env.py",
  "scripts/canonical_values.py",
  "scripts/service_catalog.py",
]

[tool.coverage.run]
patch = ["subprocess"]
parallel = true
source = ["scripts", "infra/ansible/scripts"]

[tool.coverage.report]
show_missing = true
